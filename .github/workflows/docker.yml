name: Images

# Builds one image per model with chapkit-rs's shared Dockerfile and publishes it to the GitHub
# container registry as ghcr.io/<owner>/chapkit-rs-models/<binary>, for linux/amd64 and linux/arm64.
# Each architecture builds natively on its own runner; a final job joins them into one tag.
#
# An image is published once per version (the workspace `version` in Cargo.toml), tagged with that
# version, `latest` and `sha-<commit>`. chap-core treats a model version as write-once and refuses a
# new build under a version it has seen, so an image whose version tag already exists is not built
# again: bump the version to publish a change.
on:
  push:
    branches: [main]
    # Documentation and benchmark changes do not change the images.
    paths-ignore: ["docs/**", "bench/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/chapkit-rs-models

jobs:
  version:
    name: Images to publish
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      bins: ${{ steps.plan.outputs.bins }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          bins=()
          for bin in $BINS; do
            if docker buildx imagetools inspect "$IMAGE_PREFIX/$bin:$version" >/dev/null 2>&1; then
              echo "$bin $version is already published"
            else
              bins+=("$bin")
            fi
          done
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::warning::every image is already published as $version; bump the version in Cargo.toml to publish this change"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bins=$(printf '%s\n' "${bins[@]}" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"
        env:
          BINS: baseline-global-median baseline-seasonal-median baseline-seasonal-shift-persistence baseline-persistence

  build:
    name: ${{ matrix.bin }} (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.bins != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJSON(needs.version.outputs.bins) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      # The build context holds both checkouts: the models depend on chapkit-rs by path.
      - uses: actions/checkout@v7
        with:
          path: chapkit-rs-models
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/chapkit-rs
          path: chapkit-rs
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Until chapkit-rs is versioned, record which of its commits the image was built against.
      - id: chapkit
        run: echo "revision=$(git -C chapkit-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: chapkit-rs/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            WORKSPACE=chapkit-rs-models
            BIN=${{ matrix.bin }}
            GIT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.winterop.chapkit-rs.revision=${{ steps.chapkit.outputs.revision }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.bin }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.bin }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.bin }}-${{ matrix.arch }},mode=max
      - name: Keep the digest for the merge job
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.bin }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    name: ${{ matrix.bin }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        bin: ${{ fromJSON(needs.version.outputs.bins) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.bin }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.bin }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Create the multi-architecture tags
        working-directory: digests
        run: |
          # Word splitting is intended: one -t per tag, one argument per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.bin }}@sha256:%s ' *)
      - id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.bin }}
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.bin }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
