[package]
name = "ridge"
description = "Ridge regression on covariates: a chapkit-rs example with a search space and tensor checkpoints"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chapkit.workspace = true
# Reuses the demo runner and fixture from the baselines example.
baselines.workspace = true
rand.workspace = true
rand_distr.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "ridge"
harness = false

[features]
# Lets DATABASE_URL take turso: URLs (turso:///path/to.db).
turso = ["chapkit/turso"]

[lints]
workspace = true
