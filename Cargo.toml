[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.3.5"
edition = "2024"
authors = ["Morten Hansen <morten@winterop.com>"]
publish = false

# The chapkit-rs release that CI and the image builds check out beside this repository. Locally the
# models build against the sibling checkout, whatever it holds. Moving to a new release also bumps
# the version above, so the images built against it are published.
[workspace.metadata.chapkit-rs]
version = "0.7.1"

[workspace.dependencies]
# The library, from the sibling checkout (chap-workspace/rs/chapkit-rs).
chapkit = { path = "../chapkit-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }
cpu-time = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ulid = { version = "3", features = ["serde"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
baseline-core = { path = "crates/baseline-core" }
baseline-global-median = { path = "crates/baseline-global-median" }
baseline-persistence = { path = "crates/baseline-persistence" }
baseline-seasonal-median = { path = "crates/baseline-seasonal-median" }
baseline-seasonal-shift-persistence = { path = "crates/baseline-seasonal-shift-persistence" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
result_large_err = "allow"

# The ARIMA search fits up to a hundred models per series; unoptimised, the auto-arima tests take
# minutes instead of seconds.
[profile.dev.package.chapkit-ts]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
